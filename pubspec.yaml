name: smartfinch
description: "A bird-collecting game for children — every bird you hear is one you have found"
publish_to: 'none'
version: 1.1.2+223

environment:
  sdk: ^3.7.0

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter

  # State management
  # 3.4.2+ required: earlier versions throw "markNeedsBuild called during
  # build" when a dirty provider chain is first flushed from a widget build
  # (e.g. Explore mounting after a location/language change).
  flutter_riverpod: ^3.4.2

  # Storage
  shared_preferences: ^2.3.4
  path_provider: ^2.1.5

  # Permissions
  permission_handler: ^12.0.1

  # Audio
  record: ^7.0.0
  fftea: ^1.2.0
  # Spoken detection announcements (TTS + audio session routing)
  flutter_tts: ^4.2.0
  audio_session: ^0.2.3
  # Inference
  #
  # PINNED — do not widen to a caret range without re-testing on-device.
  # 1.8.x bumps the Android native runtime from ONNX Runtime 1.22.0 to 1.23.0,
  # which routes fp32 GEMM through Arm KleidiAI (`ArmKleidiAI::MlasGemmBatch`,
  # SME/SME2 kernels). That path segfaults inside `OrtSession.run` on arm64 and
  # shipped as the v1.0.2 "crashes when starting a recording" bug.
  # See docs/developer/onnxruntime-pin.md before changing this line.
  flutter_onnxruntime: 1.7.1

  # UI & UX
  url_launcher: ^6.3.1
  # >=13.3.0 keeps the plugin's own iPad fallback (centre-of-screen anchor)
  # as a backstop; before that, a missing sharePositionOrigin made the
  # native share sheet refuse to present at all. See issue #203.
  share_plus: ^13.3.0
  package_info_plus: ^10.1.0

  # Export
  archive: ^4.0.2
  crypto: ^3.0.3

  # Localization
  intl: any
  just_audio: ^0.10.5
  just_audio_windows: ^0.2.3

  # Background service
  flutter_foreground_task: ^10.0.0
  battery_plus: ^7.0.0

  # Notifications (heads-up species alerts during surveys)
  flutter_local_notifications: ^22.0.1

  # Location
  geolocator: ^14.0.2

  # Map
  flutter_map: ^8.3.0
  latlong2: ^0.9.1

  # Icons
  material_symbols_icons: ^4.2928.1

  # Dynamic theming
  dynamic_color: ^1.9.0

  # Network & Images
  http: ^1.2.2
  path: ^1.9.0
  file_picker: ^12.0.0-beta.5
  flutter_map_marker_cluster: ^8.2.2
  drift: ^2.34.4
  sqlite3: ^3.5.2

  # Row identity across devices: UUID v4 primary keys, so two phones that
  # later sync cannot both mint the same row (DAT-08).
  uuid: ^4.6.0

  # Annotations only (@immutable); lets the scoring engine stay pure Dart
  # instead of importing flutter/foundation just for one annotation.
  meta: ^1.19.0
  flutter_svg: ^2.3.0
dev_dependencies:
  flutter_test:
    sdk: flutter
  integration_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  flutter_launcher_icons: ^0.14.3
  drift_dev: ^2.34.6
  build_runner: ^2.16.1

  # Lets a test elapse six seconds of celebration timing without taking six
  # seconds to run.
  fake_async: ^1.3.3

flutter:
  uses-material-design: true
  generate: true

  assets:
    # Two brands, one app: Schlaumeise in German, Smartfinch elsewhere.
    # The PNG marks are the source for the generated launcher icons; the
    # SVGs are what the interface draws (see `AppLogo`).
    - assets/images/schlaumeise_logo.png
    - assets/images/smartfinch_logo.png
    - assets/images/schlaumeise_logo_round.svg
    - assets/images/schlaumeise_logo_round_solidbg.svg
    - assets/images/smartfinch_logo_round.svg
    - assets/images/smartfinch_logo_round_solidbg.svg
    - assets/images/dummy_species.png
    - assets/images/icon-birdnet.png
    - assets/images/icon-ebird.png
    - assets/images/icon-inat.png
    - assets/images/icon-wikipedia.png
    - assets/models/
    - assets/species_images/
    - assets/species_data/
    # Hand-written child-register profiles (SAM-11) — authored, not
    # generated, and deliberately outside the gitignored bundle dir.
    - assets/species_profiles/
    - assets/announcements/

# The launcher icon is the one place the two brands cannot both win: it is
# baked at build time and cannot follow the device language the way the in-app
# logo does. Smartfinch is the default because it matches the package name, the
# application ID and eleven of the twelve locales; a German-market build swaps
# these four lines for the `schlaumeise-` files and `#12253F`.
#
# The inputs are generated — `python tools/build_launcher_icons.py` — because
# an adaptive foreground needs the mark inside Android's safe zone and an iOS
# icon needs no transparency at all, and neither is what a brand mark is
# exported as.
flutter_launcher_icons:
  android: true
  ios: true
  windows:
    generate: true
    image_path: "assets/images/launcher/smartfinch-icon.png"
  image_path: "assets/images/launcher/smartfinch-icon.png"
  adaptive_icon_background: "#262626"
  adaptive_icon_foreground: "assets/images/launcher/smartfinch-icon-foreground.png"
